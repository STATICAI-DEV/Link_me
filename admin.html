<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STATICWEB Business Ops</title><style>:root{--bg:#02050b;--panel:#07111f;--line:#19344f;--ink:#eef4ff;--muted:#91a5bc;--blue:#68b7ff}*{box-sizing:border-box}body{margin:0;background:#02050b;color:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px;background:#050b14}.brand{font-size:18px;font-weight:900;letter-spacing:.1em;margin-bottom:26px}.brand b{color:var(--blue)}.side button,.side a{width:100%;display:block;text-align:left;border:0;background:transparent;color:#b8c7d8;padding:12px 10px;border-radius:10px;text-decoration:none;cursor:pointer}.side button.active,.side button:hover{background:#0b1b2e;color:white}.main{padding:30px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.top h1{margin:0}.btn{border:1px solid #28547d;background:#0b1a2b;color:#fff;border-radius:10px;padding:10px 13px;cursor:pointer}.primary{background:linear-gradient(135deg,#147bff,#7b61ff);border:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.metric,.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px}.metric b{font-size:28px;display:block;margin-top:8px}.muted{color:var(--muted)}.view{display:none}.view.active{display:block}.row{display:grid;grid-template-columns:1fr 160px 130px 90px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #10263a}.row:last-child{border-bottom:0}.row small{color:var(--muted)}input,select,textarea{width:100%;background:#030913;color:#fff;border:1px solid #24455f;border-radius:9px;padding:10px}textarea{min-height:110px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stack{display:grid;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.note{padding:14px;border:1px solid var(--line);border-radius:12px;background:#05101b;margin:10px 0}.danger{border-color:#713949;color:#ffbdc7}@media(max-width:800px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.metrics{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">STATIC<b>AI</b></div><button class="tab active" data-view="dash">Dashboard</button><button class="tab" data-view="tasks">Tasks</button><button class="tab" data-view="leads">Leads</button><button class="tab" data-view="notes">Notes</button><button class="tab" data-view="content">Site Content</button><button class="tab" data-view="backup">Backup</button><a href="index.html">← Public site</a></aside><main class="main"><div class="top"><div><h1 id="title">Business Operations</h1><div class="muted">Browser-local test workspace</div></div><button class="btn" onclick="exportAll()">Export backup</button></div><section class="view active" id="dash"><div class="metrics"><div class="metric"><span class="muted">Active work</span><b id="mActive">0</b></div><div class="metric"><span class="muted">Open leads</span><b id="mLeads">0</b></div><div class="metric"><span class="muted">Completed</span><b id="mDone">0</b></div><div class="metric"><span class="muted">Notes</span><b id="mNotes">0</b></div></div><div class="card"><h3>Recent activity</h3><div id="recent" class="muted">No activity yet.</div></div></section><section class="view" id="tasks"><div class="card"><h2>Tasks</h2><div class="formgrid"><input id="taskName" placeholder="Task name"><select id="taskState"><option>Ideas</option><option>Backlog</option><option>Planned</option><option selected>Active</option><option>Blocked</option><option>Completed</option><option>Reference</option></select></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="addTask()">Add task</button></div><div id="taskList"></div></div></section><section class="view" id="leads"><div class="card"><h2>Leads</h2><div class="formgrid"><input id="leadName" placeholder="Name"><input id="leadCompany" placeholder="Company"><input id="leadContact" placeholder="Contact"><select id="leadStatus"><option>New</option><option>Contacted</option><option>Qualified</option><option>Proposal</option><option>Won</option><option>Lost</option></select></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="addLead()">Add lead</button></div><div id="leadList"></div></div></section><section class="view" id="notes"><div class="card"><h2>Notes</h2><div class="stack"><input id="noteTitle" placeholder="Title"><textarea id="noteBody" placeholder="Write a note"></textarea><button class="btn primary" onclick="addNote()">Save note</button></div><div id="noteList"></div></div></section><section class="view" id="content"><div class="card"><h2>Site Content</h2><p class="muted">These edits are saved in this browser for testing. Export them when ready to make them permanent.</p><div class="stack"><input id="cHeadline" placeholder="Hero headline"><textarea id="cBody" placeholder="Hero body"></textarea><input id="cEmail" placeholder="Contact email"><button class="btn primary" onclick="saveContent()">Save local preview data</button></div></div></section><section class="view" id="backup"><div class="card"><h2>Backup</h2><div class="actions"><button class="btn primary" onclick="exportAll()">Download JSON backup</button><label class="btn">Import JSON<input id="importFile" type="file" accept="application/json" hidden onchange="importAll(this.files[0])"></label><button class="btn danger" onclick="wipe()">Clear local data</button></div></div></section></main></div><script>const K='staticweb_ops_v2',C='staticweb_content_v2';let d=JSON.parse(localStorage.getItem(K)||'{"tasks":[],"leads":[],"notes":[]}');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.view).classList.add('active')});function save(){localStorage.setItem(K,JSON.stringify(d));render()}function addTask(){let n=$('#taskName').value.trim();if(!n)return;d.tasks.push({id:crypto.randomUUID(),name:n,state:$('#taskState').value,updated:new Date().toISOString()});$('#taskName').value='';save()}function addLead(){let n=$('#leadName').value.trim();if(!n)return;d.leads.push({id:crypto.randomUUID(),name:n,company:$('#leadCompany').value.trim(),contact:$('#leadContact').value.trim(),status:$('#leadStatus').value});['#leadName','#leadCompany','#leadContact'].forEach(x=>$(x).value='');save()}function addNote(){let b=$('#noteBody').value.trim();if(!b)return;d.notes.push({id:crypto.randomUUID(),title:$('#noteTitle').value.trim()||'Untitled',body:b,created:new Date().toISOString()});$('#noteTitle').value='';$('#noteBody').value='';save()}function del(type,id){d[type]=d[type].filter(x=>x.id!==id);save()}function render(){let active=d.tasks.filter(x=>['Planned','Active','Blocked'].includes(x.state));$('#mActive').textContent=active.length;$('#mLeads').textContent=d.leads.filter(x=>!['Won','Lost'].includes(x.status)).length;$('#mDone').textContent=d.tasks.filter(x=>x.state==='Completed').length;$('#mNotes').textContent=d.notes.length;$('#recent').textContent=[...d.tasks,...d.leads,...d.notes].length?`${d.tasks.length} tasks · ${d.leads.length} leads · ${d.notes.length} notes`:'No activity yet.';$('#taskList').innerHTML=d.tasks.map(x=>`<div class="row"><strong>${esc(x.name)}</strong><span>${esc(x.state)}</span><small>${new Date(x.updated).toLocaleString()}</small><button class="btn danger" onclick="del('tasks','${x.id}')">Delete</button></div>`).join('');$('#leadList').innerHTML=d.leads.map(x=>`<div class="row"><strong>${esc(x.name)}</strong><span>${esc(x.company||'')}</span><small>${esc(x.status)} ${esc(x.contact||'')}</small><button class="btn danger" onclick="del('leads','${x.id}')">Delete</button></div>`).join('');$('#noteList').innerHTML=d.notes.map(x=>`<div class="note"><strong>${esc(x.title)}</strong><p>${esc(x.body)}</p><button class="btn danger" onclick="del('notes','${x.id}')">Delete</button></div>`).join('')}function saveContent(){localStorage.setItem(C,JSON.stringify({headline:$('#cHeadline').value,body:$('#cBody').value,email:$('#cEmail').value}));alert('Local preview data saved')}function loadContent(){let c=JSON.parse(localStorage.getItem(C)||'{}');$('#cHeadline').value=c.headline||'Imagine Reality.';$('#cBody').value=c.body||'StaticAI builds personal AI systems that combine local intelligence, deterministic execution, creative tooling, and human control.';$('#cEmail').value=c.email||'static.ai@outlook.com'}function exportAll(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,ops:d,content:JSON.parse(localStorage.getItem(C)||'{}')},null,2)],{type:'application/json'}));a.download='STATICWEB_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importAll(f){if(!f)return;try{let o=JSON.parse(await f.text());if(o.ops)d=o.ops;if(o.content)localStorage.setItem(C,JSON.stringify(o.content));save();loadContent()}catch(e){alert('Invalid backup')}}function wipe(){if(confirm('Clear all local STATICWEB operations data?')){localStorage.removeItem(K);localStorage.removeItem(C);d={tasks:[],leads:[],notes:[]};render();loadContent()}}render();loadContent();</script></body></html>
